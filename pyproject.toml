[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pim-studio"
version = "0.48.7"
description = "Product information management for multi-market fashion e-commerce: coverage, sync, approvals, push and the photo pipeline."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Emir Togay" },
]
dependencies = [
  # HTTP client — talks to the Omnitron REST API once access lands.
  "httpx>=0.27",
  # Language detection for content defects — constrained to five candidate
  # languages, which is what makes short product names tractable.
  "lingua-language-detector>=2.0",
  # Excel — openpyxl for xlsx, xlrd for the legacy .xls backoffice exports.
  # The Check_list export ships as .xls, so xlrd is not optional here.
  "openpyxl>=3.1",
  "xlrd>=2.0",
  # Database
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  # Admin panel backend
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  # Required by FastAPI for multipart/form-data file uploads (export imports).
  "python-multipart>=0.0.9",
  # Scheduler — periodic Omnitron sync and daily readiness snapshots.
  "apscheduler>=3.10",
  # Logging
  "structlog>=24.1",
  # Config
  "pydantic>=2.8",
  "pydantic-settings>=2.3",
  # Auth — argon2 for password hashing, itsdangerous for Starlette's
  # SessionMiddleware signed-cookie session.
  "passlib[argon2]>=1.7",
  "itsdangerous>=2.2",
  # Demo mode — the placeholder product photos the mocks serve and publish.
  "pillow>=10.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
