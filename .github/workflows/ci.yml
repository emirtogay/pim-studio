# Lint + test the backend and type-check + build the frontend, on every push to main and every pull request.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Ruff blocks the build. The backlog this workflow was born with (E501
      # long lines, SIM105 try/except/pass, B008 FastAPI-`Depends`-in-default)
      # is cleared, so `src` and `tests` lint clean and any new finding is
      # genuinely new — which is the only state in which a red lint job means
      # something. Keep it that way: fix the finding rather than reinstating
      # `continue-on-error`.
      - name: Ruff (lint)
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/pim_studio/admin/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/pim_studio/admin/frontend/package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`: strict type-check, then the production bundle.
      - name: Type-check and build
        run: npm run build
